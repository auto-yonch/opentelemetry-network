[package]
name = "element-queue"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "element_queue"
path = "src/lib.rs"

# Round-trip tests only: the crate itself stays independent of any render
# package, so the writer works for every generated encoder.
[dev-dependencies]
render_parser = { workspace = true }
encoder_ebpf_net_matching = { path = "../render/ebpf_net/matching" }

